name: Extract new voice folders

on:
  push:
    paths:
      - grimoire-app-standalone.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy voice folders c, d, e, f into blocks/
        run: |
          set -e
          rm -rf /tmp/bundle
          mkdir -p /tmp/bundle
          unzip -q grimoire-app-standalone.zip -d /tmp/bundle
          SRC="$(ls /tmp/bundle | head -n 1)"
          BASE="/tmp/bundle/$SRC"
          if [ ! -d "$BASE/blocks" ]; then BASE="/tmp/bundle"; fi
          for v in voice-c-female-soothing voice-d-female-sultry voice-e-male-calming-deep voice-f-male-deep-british; do
            mkdir -p "blocks/$v"
            cp -f "$BASE/blocks/$v"/*.mp3 "blocks/$v"/
          done
          rm -f grimoire-app-standalone.zip
          for v in voice-c-female-soothing voice-d-female-sultry voice-e-male-calming-deep voice-f-male-deep-british; do
            echo "$v: $(ls "blocks/$v"/*.mp3 | wc -l) mp3 files"
          done
      - name: Commit new voice folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocks/
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Add voice folders c, d, e, f (153 clips each) from bundle"
          git push
